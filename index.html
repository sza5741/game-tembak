
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #090b20;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    h1 { color: #67f7ff; }
    #game {
        display: block;
        width: min(95vw, 500px);
        height: auto;
        margin: 10px auto;
        background: #101532;
        border: 2px solid #67f7ff;
        border-radius: 10px;
        touch-action: none;
    }
    button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        margin: 5px;
        background: #6548f5;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    .controls { margin: 10px auto; }
    p { color: #d8dcff; }
</style>
</head>
<body>

<h1>🚀 SPACE SHOOTER</h1>
<p>Skor: <span id="score">0</span> |
   Nyawa: <span id="lives">3</span></p>

<canvas id="game" width="500" height="600"></canvas>

<button onclick="startGame()">▶ Mulai / Ulang</button>

<div class="controls">
    <button id="left">⬅️ Kiri</button>
    <button id="fire">🔫 TEMBAK</button>
    <button id="right">Kanan ➡️</button>
</div>

<p>Gerak: tombol ← → atau A / D<br>
Tembak: Spasi | Hindari musuh berwarna merah!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");

let player, bullets, enemies, score, lives;
let keys = {};
let running = false;
let lastShot = 0;
let spawnTimer = 0;
let animationId;

function reset() {
    player = { x: 230, y: 530, w: 40, h: 40, speed: 5 };
    bullets = [];
    enemies = [];
    score = 0;
    lives = 3;
    lastShot = 0;
    spawnTimer = 0;
    scoreText.textContent = score;
    livesText.textContent = lives;
}

function startGame() {
    cancelAnimationFrame(animationId);
    reset();
    running = true;
    loop();
}

function shoot() {
    if (!running) return;
    const now = performance.now();
    if (now - lastShot < 220) return;
    lastShot = now;
    bullets.push({
        x: player.x + player.w / 2 - 3,
        y: player.y,
        w: 6,
        h: 16,
        speed: 8
    });
}

function spawnEnemy() {
    enemies.push({
        x: Math.random() * 450,
        y: -35,
        w: 35,
        h: 35,
        speed: 2 + Math.random() * 2
    });
}

function hit(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function drawPlayer() {
    ctx.fillStyle = "#67f7ff";
    ctx.beginPath();
    ctx.moveTo(player.x + 20, player.y);
    ctx.lineTo(player.x, player.y + 38);
    ctx.lineTo(player.x + 40, player.y + 38);
    ctx.closePath();
    ctx.fill();
}

function loop() {
    if (!running) return;

    ctx.fillStyle = "#101532";
    ctx.fillRect(0, 0, 500, 600);

    // Bintang di luar angkasa
    ctx.fillStyle = "white";
    for (let i = 0; i < 45; i++) {
        const x = (i * 97) % 500;
        const y = (i * 137 + Date.now() / 40) % 600;
        ctx.fillRect(x, y, 2, 2);
    }

    // Gerakan pemain
    if ((keys.ArrowLeft || keys.a) && player.x > 0)
        player.x -= player.speed;
    if ((keys.ArrowRight || keys.d) && player.x < 460)
        player.x += player.speed;

    if (keys[" "]) shoot();

    drawPlayer();

    // Peluru pemain
    ctx.fillStyle = "#ffe66d";
    bullets.forEach(b => {
        b.y -= b.speed;
        ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    bullets = bullets.filter(b => b.y > -20);

    // Musuh muncul
    spawnTimer++;
    if (spawnTimer > 40) {
        spawnEnemy();
        spawnTimer = 0;
    }

    ctx.font = "30px Arial";
    enemies.forEach(e => {
        e.y += e.speed;
        ctx.fillStyle = "#ff4d6d";
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = "white";
        ctx.fillText("👾", e.x - 1, e.y + 29);
    });

    // Tabrakan peluru dan musuh
    bullets = bullets.filter(b => {
        const target = enemies.find(e => hit(b, e));
        if (target) {
            target.dead = true;
            score += 10;
            scoreText.textContent = score;
            return false;
        }
        return true;
    });
    enemies = enemies.filter(e => !e.dead);

    // Musuh mencapai pemain
    enemies = enemies.filter(e => {
        if (hit(e, player) || e.y > 600) {
            lives--;
            livesText.textContent = lives;
            if (lives <= 0) endGame();
            return false;
        }
        return true;
    });

    if (running) animationId = requestAnimationFrame(loop);
}

function endGame() {
    running = false;
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(0, 0, 500, 600);
    ctx.fillStyle = "#67f7ff";
    ctx.textAlign = "center";
    ctx.font = "32px Arial";
    ctx.fillText("GAME OVER", 250, 270);
    ctx.font = "22px Arial";
    ctx.fillText("Skor: " + score, 250, 315);
    ctx.font = "16px Arial";
    ctx.fillText("Klik Mulai / Ulang untuk bermain lagi", 250, 355);
    ctx.textAlign = "start";
}

document.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", " "].includes(e.key))
        e.preventDefault();
    keys[e.key] = true;
});
document.addEventListener("keyup", e => keys[e.key] = false);

function holdButton(id, key) {
    const button = document.getElementById(id);
    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
        button.setPointerCapture(e.pointerId);
    });
    button.addEventListener("pointerup", () => keys[key] = false);
    button.addEventListener("pointercancel", () => keys[key] = false);
    button.addEventListener("lostpointercapture", () => keys[key] = false);
}

holdButton("left", "ArrowLeft");
holdButton("right", "ArrowRight");
holdButton("fire", " ");
reset();

ctx.fillStyle = "#101532";
ctx.fillRect(0, 0, 500, 600);
ctx.fillStyle = "#67f7ff";
ctx.textAlign = "center";
ctx.font = "26px Arial";
ctx.fillText("SPACE SHOOTER", 250, 270);
ctx.font = "18px Arial";
ctx.fillText("Klik Mulai untuk bermain!", 250, 315);
ctx.textAlign = "start";
</script>
</body>
</html>
